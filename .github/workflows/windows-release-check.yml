name: Windows release check
on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop release version (for example 0.0.2)
        required: true
        type: string

permissions: {}

jobs:
  download:
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write # GitHub only exposes drafts to collaborators with push access.
    steps:
      - name: Download the versioned Windows player
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric release version' }
          $zip = "The-Line-Holds-$env:VERSION-Windows-x64.zip"
          gh release download "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --pattern $zip
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          Write-Host "Archive SHA-256: $((Get-FileHash $zip).Hash)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-player
          path: The-Line-Holds-*-Windows-x64.zip
          compression-level: 0
          retention-days: 1

  launch:
    needs: download
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-player
      - name: Launch on Windows and deploy from the title screen
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          Expand-Archive -LiteralPath "The-Line-Holds-$env:VERSION-Windows-x64.zip" -DestinationPath "$env:RUNNER_TEMP/game"
          $game = "$env:RUNNER_TEMP/game/Windows/The Line Holds.exe"
          $version = $env:VERSION
          $log = "$env:RUNNER_TEMP/player.log"
          $player = Start-Process $game -ArgumentList "-screen-fullscreen 0 -screen-width 1024 -screen-height 768 -logFile `"$log`"" -PassThru
          $keys = New-Object -ComObject WScript.Shell
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $nextSubmit = (Get-Date).AddSeconds(6)
            do {
              Start-Sleep -Milliseconds 500
              $player.Refresh()
              if ($player.HasExited) { throw "Player exited with $($player.ExitCode)" }
              $text = if (Test-Path $log) { Get-Content $log -Raw }
              if ($text -match [regex]::Escape("The Line Holds $version ready on WindowsPlayer")) {
                Write-Host ($Matches[0])
                return
              }
              if ((Get-Date) -gt $nextSubmit -and $player.MainWindowHandle -ne 0) {
                [void]$keys.AppActivate($player.Id)
                $keys.SendKeys('{ENTER}')
                $nextSubmit = (Get-Date).AddSeconds(4)
              }
            } while ((Get-Date) -lt $deadline)
            throw 'The player did not reach the battlefield after title-screen input'
          } finally {
            if (Test-Path $log) { Get-Content $log -Tail 55 }
            if (!$player.HasExited) { Stop-Process -Id $player.Id -Force }
          }
